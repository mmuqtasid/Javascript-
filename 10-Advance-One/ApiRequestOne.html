<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub API Request</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 32px;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .card img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #58a6ff;
            margin-bottom: 16px;
        }

        .card h2 {
            color: #e6edf3;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .card .username {
            color: #58a6ff;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .card .bio {
            color: #8b949e;
            font-size: 0.88rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #30363d;
            padding-top: 20px;
            margin-top: 4px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stat span:first-child {
            color: #e6edf3;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .stat span:last-child {
            color: #8b949e;
            font-size: 0.78rem;
        }

        .loading {
            color: #8b949e;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <p class="loading">Loading...</p>
    </div>

    <script>
        const requestURL = 'https://api.github.com/users/mmuqtasid';
        const xhr = new XMLHttpRequest();
        xhr.open('GET', requestURL);

        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                const data = JSON.parse(this.responseText);
                buildCard(data);
            }
        };

        xhr.send();

        function buildCard(data) {
            const card = document.getElementById('card');

            card.innerHTML = `
                <img src="${data.avatar_url}" alt="${data.name}" />
                <h2>${data.name || 'No Name'}</h2>
                <p class="username">@${data.login}</p>
                <p class="bio">${data.bio || 'No bio available.'}</p>
                <div class="stats">
                    <div class="stat">
                        <span>${data.public_repos}</span>
                        <span>Repos</span>
                    </div>
                    <div class="stat">
                        <span>${data.followers}</span>
                        <span>Followers</span>
                    </div>
                    <div class="stat">
                        <span>${data.following}</span>
                        <span>Following</span>
                    </div>
                </div>
            `;
        }
    </script>

</body>
</html>
