<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #060b18;
            --bg-mid: #0d1628;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #4fc3f7;
            --accent-warm: #ffa040;
            --text-primary: #e8f0fe;
            --text-muted: #6b7fa3;
            --text-dim: #3a4a6b;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-deep);
            font-family: 'Syne', sans-serif;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            animation: drift 12s ease-in-out infinite alternate;
        }
        body::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #1a6cf5, transparent);
            top: -100px;
            left: -100px;
        }
        body::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #0097c4, transparent);
            bottom: -80px;
            right: -80px;
            animation-direction: alternate-reverse;
        }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 30px) scale(1.08); }
        }

        /* Starfield dots */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 55%, rgba(255,255,255,0.25) 0%, transparent 100%),
                radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.15) 0%, transparent 100%),
                radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 55% 90%, rgba(255,255,255,0.1) 0%, transparent 100%);
        }

        .card {
            position: relative;
            z-index: 10;
            width: 420px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px 36px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03),
                0 40px 80px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.06);
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .header-icon {
            font-size: 22px;
        }

        .header h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* Search */
        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
        }

        #city-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 13px 18px;
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
        }

        #city-input::placeholder {
            color: var(--text-dim);
        }

        #city-input:focus {
            border-color: var(--accent);
            background: rgba(79, 195, 247, 0.06);
            box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.1);
        }

        #search-button {
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.25);
            white-space: nowrap;
        }

        #search-button:hover {
            background: #81d4fa;
            box-shadow: 0 4px 28px rgba(79, 195, 247, 0.4);
        }

        #search-button:active {
            transform: scale(0.96);
        }

        #search-button.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: var(--glass-border);
            margin-bottom: 28px;
        }

        /* Weather result */
        .result {
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .result.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .location-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        #city-name {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.2;
            color: var(--text-primary);
            flex: 1;
        }

        .temp-badge {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        #city-temp {
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
            color: var(--accent);
            letter-spacing: -2px;
        }

        .temp-unit {
            font-size: 13px;
            color: var(--text-muted);
            font-family: 'DM Mono', monospace;
        }

        /* Info grid */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-tile {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px 16px;
            transition: background 0.2s;
        }

        .info-tile:hover {
            background: rgba(255,255,255,0.06);
        }

        .info-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 5px;
            font-family: 'DM Mono', monospace;
        }

        .info-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .info-value.highlight {
            color: var(--accent);
        }

        /* Time row */
        .time-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
        }

        .time-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #city-time {
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 300;
        }

        /* Error */
        .error-msg {
            display: none;
            background: rgba(255, 80, 80, 0.08);
            border: 1px solid rgba(255, 80, 80, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: #ff8080;
            font-family: 'DM Mono', monospace;
            margin-bottom: 0;
        }

        .error-msg.show {
            display: block;
        }

        /* Default state hint */
        .hint {
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
            font-family: 'DM Mono', monospace;
            padding: 20px 0 8px;
            transition: opacity 0.3s;
        }

        .hint.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="card">
        <div class="header">
            <span class="header-icon">🌐</span>
            <h1>Weather Fetch</h1>
        </div>

        <div class="search-row">
            <input id="city-input" type="text" placeholder="Enter city name..." />
            <button id="search-button">Search</button>
        </div>

        <div class="divider"></div>

        <p class="error-msg" id="error-msg">City not found. Please try again.</p>

        <div class="hint" id="hint">Enter a city above to get live weather</div>

        <div class="result" id="result">
            <div class="location-row">
                <h3 id="city-name">—</h3>
                <div class="temp-badge">
                    <span id="city-temp">—</span>
                    <span class="temp-unit">°C</span>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-tile">
                    <div class="info-label">Condition</div>
                    <div class="info-value" id="city-condition">—</div>
                </div>
                <div class="info-tile">
                    <div class="info-label">Feels Like</div>
                    <div class="info-value highlight" id="city-feels">—°C</div>
                </div>
                <div class="info-tile">
                    <div class="info-label">Humidity</div>
                    <div class="info-value" id="city-humidity">—%</div>
                </div>
                <div class="info-tile">
                    <div class="info-label">Wind</div>
                    <div class="info-value" id="city-wind">— km/h</div>
                </div>
            </div>

            <div class="time-row">
                <div class="time-dot"></div>
                <span id="city-time">Local time: —</span>
            </div>
        </div>
    </div>

    <script src="script.js">
    </script>
</body>
</html>
